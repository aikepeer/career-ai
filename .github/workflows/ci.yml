name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked

  windows-check:
    # Cross-target type-check from a Linux runner via the
    # `x86_64-pc-windows-gnu` Rust target + `mingw-w64`. Catches
    # Windows-incompat code (cfg-gating slips, std::fs::rename
    # surprises, tokio::signal::unix in headless code) at PR time
    # rather than at release time. Sub-minute incremental thanks
    # to the shared rust-cache.
    name: windows-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # `cargo check` (not `cargo build`) — type-check catches the
      # cfg/feature slips. Running the linker on Windows artifacts
      # from a Linux host is slower and not informative here.
      # `--workspace --all-targets` includes tests, which is where the
      # tokio::signal::unix slip from PR #44 originally hid.
      - run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu --locked

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-audit
      # RUSTSEC-2023-0071 (rsa Marvin attack): rsa is a ghost lockfile entry
      # pulled by sqlx-mysql, which we do not compile — only the sqlite
      # driver is enabled. `cargo tree -i rsa` confirms it is absent from
      # the compiled graph. No upstream fix exists; safe to ignore until
      # sqlx prunes the unused dep.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-deny
      # Runs the four standard deny.toml checks: advisories, licenses,
      # bans (duplicates / wildcards), and sources. Policy is in
      # deny.toml at repo root. RUSTSEC-2023-0071 is ignored there to
      # match cargo-audit.
      - run: cargo deny check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Coverage is informational on PRs and recorded as an artifact
    # rather than gating merges. Once we have a Codecov / Coveralls
    # account the artifact upload step gets swapped for `codecov-action`
    # with a delta-fail threshold (TODO.md: "fails on a coverage drop
    # > 1%"). Until then, the lcov.info artifact is downloadable from
    # the run page and parseable by any local tool.
    #
    # `continue-on-error: true` keeps this job non-blocking — a
    # `cargo install` flake or transient cargo-llvm-cov bug must not
    # block merge of an otherwise-green PR (Codex P2 on PR #64).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      # `--locked` matches every other cargo job in this workflow so
      # an upstream-crate publish can't make the coverage job fail
      # independently of the tested code (Codex P2 on PR #64).
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: lcov.info
          if-no-files-found: error
          retention-days: 14
      # Print a per-crate summary so the run log surfaces the headline
      # numbers without forcing reviewers to download the artifact.
      - name: Coverage summary
        run: cargo llvm-cov report
