# Release workflow — builds prebuilt binaries for `careerai` and
# `careerai-mcp` and uploads them to a GitHub Release whenever a tag of
# the form `v*` is pushed. Generated by hand to mirror what
# `cargo dist init` would produce; refresh by running
# `cargo install --locked cargo-dist` then `cargo dist init` once you
# need to bump targets or installer scripts.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Intentionally NOT setting `RUSTFLAGS: -D warnings` here — release
  # builds shouldn't fail on benign upstream-dep warnings. The
  # warnings-as-errors gate lives in `ci.yml` (clippy on PRs/main).

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            binaries: careerai careerai-mcp
            install_musl: true
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            binaries: careerai careerai-mcp
          # Intel macOS (`macos-13`) is intentionally not in the matrix.
          # The free GitHub Actions `macos-13` runner queue routinely
          # backs up for 1–6 h, blocking publish indefinitely. Apple
          # Silicon (`aarch64-apple-darwin`) covers every 2020+ Mac;
          # Intel users can `cargo install --git
          # https://github.com/justdoGIT/career-ai careerai-cli
          # careerai-mcp` against the v0.1.1-mcp tag instead.
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            archive: zip
            binaries: careerai.exe careerai-mcp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.install_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        # `shell: bash` is required so the bash `\` line-continuation
        # below works on the Windows runner (which defaults to
        # PowerShell, where `\` is a literal arg and breaks parsing).
        # Other steps in this file already set `shell: bash` for the
        # same reason.
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p careerai-cli -p careerai-mcp

      - name: Stage artifacts
        # `7z` is preinstalled on `windows-latest` runners (GitHub-hosted);
        # `tar` is preinstalled everywhere else. No extra setup needed.
        shell: bash
        run: |
          stage="careerai-${{ needs.plan.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "$stage"
          for bin in ${{ matrix.binaries }}; do
            cp "target/${{ matrix.target }}/release/$bin" "$stage/"
          done
          cp README.md CHANGELOG.md "$stage/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$stage.zip" "$stage"
            echo "ARTIFACT=$stage.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$stage.tar.gz" "$stage"
            echo "ARTIFACT=$stage.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARTIFACT }}

  publish:
    name: publish release
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          # Multiple glob patterns must be newline-separated; a single
          # space-delimited string is interpreted as ONE pattern by
          # softprops/action-gh-release@v2 and silently matches nothing.
          # The v0.1.1-mcp first-publish attempt logged exactly that:
          # "🤔 Pattern 'dist/**/*.tar.gz dist/**/*.zip' does not match
          # any files." — and shipped a release with zero assets.
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
