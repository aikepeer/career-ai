name: DeepSeek Claude Code Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  agent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets are not exposed to forked PRs, and running an AI agent on
    # untrusted code could disclose secrets through prompt injection.
    # Only run on branches from this repo, not forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # ── Step 1: Measure diff size FIRST ────────────────────────────────
      # Route effort level based on diff size to avoid paying frontier-model
      # cost on trivial one-liner PRs.
      - name: Measure diff size
        id: diff_size
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          DIFF_LINES=$(gh pr diff "$PR" 2>/dev/null | wc -l || echo "0")
          echo "lines=$DIFF_LINES" >> "$GITHUB_OUTPUT"
          if   [ "$DIFF_LINES" -lt 50  ]; then effort="low"
          elif [ "$DIFF_LINES" -lt 300 ]; then effort="medium"
          else                                  effort="high"
          fi
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "Diff lines: $DIFF_LINES → effort: $effort"

      # ── Step 2: Select model based on effort ───────────────────────────
      # DeepSeek-only: flash for low/medium, pro for high-effort reviews.
      # Sub-agent model is always flash to keep internal tool-call cost low.
      - name: Check API key and select model
        id: model
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EFFORT: ${{ steps.diff_size.outputs.effort }}
        run: |
          if [ -z "$KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DeepSeek API key not configured — skipping agent review"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          case "$EFFORT" in
            low)    main="deepseek-v4-flash"   ;;
            medium) main="deepseek-v4-flash"   ;;
            *)      main="deepseek-v4-pro[1m]"  ;;
          esac
          echo "model=$main" >> "$GITHUB_OUTPUT"
          echo "Using DeepSeek — main: $main  sub: deepseek-v4-flash  effort: $EFFORT"

      # ── Step 3: Install Claude Code ────────────────────────────────────
      - name: Setup Node.js
        if: steps.model.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Claude Code
        if: steps.model.outputs.enabled == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # ── Step 4: Run Claude Code review with DeepSeek ───────────────────
      # Cache strategy:
      #   - Skill file (configs/claude/skills/pr-reviewer/SKILL.md) is the
      #     stable prefix committed to the repo. DeepSeek caches it after
      #     the first run. Every subsequent run is a cache hit on that prefix.
      #   - Only the diff (variable part) is appended after the stable prefix.
      #   - Secrets are step-scoped env vars — never written to GITHUB_OUTPUT.
      - name: Run Claude Code review
        if: steps.model.outputs.enabled == 'true'
        env:
          ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: ${{ steps.model.outputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.model.outputs.model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.model.outputs.model }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-flash"
          CLAUDE_CODE_SUBAGENT_MODEL: "deepseek-v4-flash"
          CLAUDE_CODE_EFFORT_LEVEL: "max"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN_MODEL: ${{ steps.model.outputs.model }}
          EFFORT: ${{ steps.diff_size.outputs.effort }}
          DIFF_LINES: ${{ steps.diff_size.outputs.lines }}
        run: |
          set -eo pipefail

          # ── Create temp files ─────────────────────────────────────────
          DIFF_FILE=$(mktemp)
          REVIEW_FILE=$(mktemp)
          PROMPT_FILE=$(mktemp)
          FILTERED_DIFF=$(mktemp)
          trap 'rm -f "$DIFF_FILE" "$REVIEW_FILE" "$PROMPT_FILE" "$FILTERED_DIFF"' EXIT

          echo "=== PR #$PR | model: $MAIN_MODEL | effort: $EFFORT | diff lines: $DIFF_LINES ==="

          # ── Fetch changed file list ───────────────────────────────────
          echo "Changed files:"
          gh pr diff "$PR" --name-only 2>/dev/null | sort || true
          echo ""

          # ── Fetch diff (once, filtered) ───────────────────────────────
          if ! gh pr diff "$PR" > "$DIFF_FILE" 2>/dev/null; then
            echo "ERROR: gh pr diff failed" >&2
            exit 1
          fi
          if [ ! -s "$DIFF_FILE" ]; then
            echo "ERROR: PR diff is empty" >&2
            exit 1
          fi

          # Strip noise files before review (lockfiles, generated assets)
          grep -v '^diff --git.*\(Cargo\.lock\|\.min\.js\|package-lock\.json\|\.lock\|_generated/\)' \
            "$DIFF_FILE" > "$FILTERED_DIFF" || true

          # ── Load stable skill prefix from repo ────────────────────────
          SKILL_FILE="configs/claude/skills/pr-reviewer/SKILL.md"
          if [ -f "$SKILL_FILE" ]; then
            SKILL_CONTENT=$(cat "$SKILL_FILE")
            echo "Loaded review skill: $SKILL_FILE"
          else
            echo "WARNING: $SKILL_FILE not found, using fallback prompt"
            SKILL_CONTENT="Review this PR diff for bugs, security issues, and code quality problems.
          Output one line per finding: FINDING|path|line|severity|description
          Severity: P1 (bug/security/crash) or P2 (code quality/maintainability).
          Skip style, formatting, and whitespace-only issues.
          If nothing found, output exactly: No issues found"
          fi

          # ── Build prompt with stable prefix + diff ────────────────────
          {
            printf '%s\n\n' "$SKILL_CONTENT"
            printf '%s\n' '---'
            printf '%s %s lines):\n' 'PR DIFF (read-only audit,' "$DIFF_LINES"
            cat "$FILTERED_DIFF"
          } > "$PROMPT_FILE"

          echo "Prompt size: $(wc -l < "$PROMPT_FILE") lines"

          # ── Run review ────────────────────────────────────────────────
          echo "=== Agent review (Claude Code / $MAIN_MODEL) ==="
          claude --max-turns 12 -p < "$PROMPT_FILE" 2>&1 | tee "$REVIEW_FILE"
          echo ""

          # ── Post inline review comments ───────────────────────────────
          echo "=== Posting review comments ==="
          if ! grep -q '^FINDING|' "$REVIEW_FILE"; then
            gh pr comment "$PR" --body "## Claude Code Review (DeepSeek / $MAIN_MODEL)

          No issues found in this PR." || true
            exit 0
          fi

          COMMENT_COUNT=0
          while IFS='|' read -r _ path line severity desc; do
            [ -n "$path" ] && [ -n "$line" ] || continue
            [ "$COMMENT_COUNT" -lt 10 ] || break

            case "$severity" in
              P1) BADGE="![P1](https://img.shields.io/badge/P1-critical-red?style=flat-square)" ;;
              *)   BADGE="![P2](https://img.shields.io/badge/P2-warning-yellow?style=flat-square)" ;;
            esac

            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
              -f body="$BADGE $desc" \
              -f path="$path" \
              -f commit_id="$HEAD_SHA" \
              -f line="$line" \
              -f side="RIGHT" \
              2>/dev/null || true

            COMMENT_COUNT=$((COMMENT_COUNT + 1))
          done < <(grep '^FINDING|' "$REVIEW_FILE")
          echo "Posted $COMMENT_COUNT inline review comments"

          # ── Post summary comment ──────────────────────────────────────
          TOTAL=$(grep -c '^FINDING|'           "$REVIEW_FILE" || echo 0)
          P1=$(   grep -c '^FINDING|[^|]*|[^|]*|P1|' "$REVIEW_FILE" || echo 0)
          P2=$(   grep -c '^FINDING|[^|]*|[^|]*|P2|' "$REVIEW_FILE" || echo 0)

          {
            printf '## Claude Code Review (DeepSeek / %s)\n\n' "$MAIN_MODEL"
            printf '_Diff: %s lines | Effort: %s | Findings: %s (P1=%s P2=%s)_\n\n' \
              "$DIFF_LINES" "$EFFORT" "$TOTAL" "$P1" "$P2"
            printf '| Severity | File | Line | Description |\n'
            printf '|----------|------|------|-------------|\n'
            while IFS='|' read -r _ path line severity desc; do
              [ -n "$path" ] || continue
              printf '| %s | `%s` | %s | %s |\n' "$severity" "$path" "$line" "$desc"
            done < <(grep '^FINDING|' "$REVIEW_FILE")
          } | gh pr comment "$PR" --body-file - 2>/dev/null || true
