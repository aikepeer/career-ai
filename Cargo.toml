[workspace]
resolver = "2"
members = [
    "crates/careerai-cli",
    "crates/careerai-core",
    "crates/careerai-db",
    "crates/careerai-profile",
    "crates/careerai-sources",
    "crates/careerai-match",
    "crates/careerai-llm",
    "crates/careerai-tailor",
    "crates/careerai-render",
    "crates/careerai-submit",
    "crates/careerai-scheduler",
    "crates/careerai-pipeline",
    "crates/careerai-mcp",
    "crates/careerai-notify",
    "crates/careerai-dashboard",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/justdoGIT/career-ai"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
validator = { version = "0.20", features = ["derive"] }
uuid = { version = "1", features = ["v7", "serde"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
rig-core = { version = "0.10", default-features = false }
tera = { version = "1", default-features = false }
which = "7"
sha2 = "0.10"
hex = "0.4"
backon = "1"
tempfile = "3"
insta = { version = "1", features = ["yaml", "json"] }
docx-rs = "0.4"
wiremock = "0.6"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
governor = "0.10"
keyring = "3"
tokio-cron-scheduler = "0.13"
futures = "0.3"
scraper = "0.26"
base64 = "0.22"
rmcp = { version = "1.5", default-features = false, features = ["server", "macros", "transport-io", "schemars", "client", "transport-child-process"] }
schemars = "1"
quick-xml = { version = "0.38", features = ["serialize"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# cargo-dist — prebuilt binaries on GitHub Releases. Run `cargo dist init`
# once on this manifest to refresh the workflow when bumping cargo-dist.
[workspace.metadata.dist]
cargo-dist-version = "0.25.1"
ci = "github"
installers = ["shell", "powershell"]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-gnu",
]
# Only ship the user-facing binaries; pipeline crates are libraries.
include = []
publish-jobs = []
pr-run-mode = "plan"

[profile.dev]
opt-level = 0
debug = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
