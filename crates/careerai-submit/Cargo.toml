[package]
name = "careerai-submit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Submitters per source (HTTP, browser, email) with dry-run safety"

[dependencies]
careerai-core = { path = "../careerai-core" }
careerai-db = { path = "../careerai-db" }
careerai-profile = { path = "../careerai-profile" }
careerai-render = { path = "../careerai-render" }
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
reqwest = { workspace = true }
uuid.workspace = true
chrono.workspace = true
sqlx = { workspace = true }
keyring = { workspace = true }
sha2.workspace = true
hex.workspace = true
chromiumoxide = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
governor = { workspace = true }
rand = "0.9"
base64 = { workspace = true }

[features]
default = []
browser = ["dep:chromiumoxide", "dep:futures"]

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
scraper = { workspace = true }

[lints]
workspace = true
