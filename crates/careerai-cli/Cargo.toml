[package]
name = "careerai-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "career-ai command-line interface"

[[bin]]
name = "careerai"
path = "src/main.rs"

[dependencies]
careerai-core = { path = "../careerai-core" }
careerai-profile = { path = "../careerai-profile" }
careerai-db = { path = "../careerai-db" }
careerai-llm = { path = "../careerai-llm" }
careerai-tailor = { path = "../careerai-tailor" }
careerai-render = { path = "../careerai-render" }
careerai-submit = { path = "../careerai-submit" }
careerai-scheduler = { path = "../careerai-scheduler" }
careerai-pipeline = { path = "../careerai-pipeline" }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
keyring.workspace = true
rpassword = "7"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
careerai-pipeline = { path = "../careerai-pipeline" }
docx-rs.workspace = true
tempfile.workspace = true
which.workspace = true
sqlx.workspace = true

[features]
default = []
live-llm = ["careerai-pipeline/live-llm", "careerai-llm/live-llm"]
# Enables the LinkedIn browser submitter path in careerai-submit.
# Build: `cargo build -p careerai-cli --features browser`.
browser = ["careerai-pipeline/browser"]

[lints]
workspace = true
