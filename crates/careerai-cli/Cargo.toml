[package]
name = "careerai-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "career-ai command-line interface"

[[bin]]
name = "careerai"
path = "src/main.rs"

[dependencies]
careerai-core = { path = "../careerai-core" }
careerai-profile = { path = "../careerai-profile" }
careerai-db = { path = "../careerai-db" }
careerai-llm = { path = "../careerai-llm" }
careerai-tailor = { path = "../careerai-tailor" }
careerai-render = { path = "../careerai-render" }
careerai-submit = { path = "../careerai-submit" }
careerai-scheduler = { path = "../careerai-scheduler" }
careerai-pipeline = { path = "../careerai-pipeline" }
careerai-sources = { path = "../careerai-sources" }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
keyring.workspace = true
rpassword = "7"
tempfile = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
which.workspace = true

[dev-dependencies]
careerai-pipeline = { path = "../careerai-pipeline" }
docx-rs.workspace = true
tempfile.workspace = true
sqlx.workspace = true

[features]
default = ["live-llm-cli"]
# Granular pass-through. The CLI binary defaults to the claude CLI
# subprocess backend so a vanilla `cargo install careerai-cli` works for
# Claude Code subscribers without an API key. Add `--features
# live-llm-api` to also pull in rig-core for the Anthropic API path.
live-llm-cli = ["careerai-pipeline/live-llm-cli", "careerai-llm/live-llm-cli", "dep:tempfile"]
live-llm-api = ["careerai-pipeline/live-llm-api", "careerai-llm/live-llm-api", "dep:tempfile"]
# Back-compat umbrella alias.
live-llm = ["live-llm-cli", "live-llm-api"]
# Enables the LinkedIn browser submitter path in careerai-submit.
# Build: `cargo build -p careerai-cli --features browser`.
browser = ["careerai-pipeline/browser"]

[lints]
workspace = true
