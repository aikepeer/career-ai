[package]
name = "careerai-sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Job-board discovery adapters behind a unified Source trait"

[dependencies]
careerai-core = { path = "../careerai-core" }
serde_yaml.workspace = true
futures.workspace = true
# Optional dep — only pulled in when the `browser` feature is on.
# Sources do not call submission logic; this dep is *purely* for
# `BrowserSession` + `Credential` reuse so the LinkedIn browser
# discovery adapter doesn't duplicate the stealth-v2.js / cookie /
# CDP-launch machinery the M5 submitter already maintains. The
# crate-boundary rule in CLAUDE.md ("sources never does submission")
# is preserved at the call-site level: this adapter does NOT call
# anything from `careerai_submit::base` / `linkedin` / `naukri`.
careerai-submit = { path = "../careerai-submit", features = ["browser"], optional = true }
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
regex = "1"
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
tokio = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
governor.workspace = true
quick-xml.workspace = true
chromiumoxide = { workspace = true, optional = true }
rand = { version = "0.9", optional = true }
# `scraper` is always-on so the offline parser tests + the
# pure-function parser path don't need feature gating. The crate is
# small (depends on `html5ever` + `selectors`) and the parser is
# also useful for other future HTML sources.
scraper = { workspace = true }

[features]
default = []
# Enables the LinkedIn browser-driven discovery adapter. Pulls in
# `careerai-submit` for `BrowserSession` + `Credential` reuse and
# `chromiumoxide` for the CDP element-handle API used to scrape
# search-result cards. CI default is off; the workspace `--features
# browser` build (driven from `careerai-cli`) opts in.
browser = ["dep:careerai-submit", "dep:chromiumoxide", "dep:rand"]

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true
serde_yaml.workspace = true
rmcp = { workspace = true, features = ["client", "server", "macros", "transport-io", "transport-child-process", "transport-async-rw", "schemars"] }
schemars.workspace = true
insta.workspace = true

# Integration test for the MCP-jobs adapter. `harness = false` so we
# can hijack `main()` to switch between client-test mode and
# stdio-server mode (the parent re-execs itself with
# `CAREERAI_FAKE_MCP=1` to act as a fake MCP server). The default
# libtest harness can't be used here because it writes its own banner
# to stdout before any test function runs, which would corrupt the
# JSON-RPC frames the child must speak on stdio.
[[test]]
name = "mcp_jobs_it"
path = "tests/mcp_jobs_it.rs"
harness = false

[lints]
workspace = true
