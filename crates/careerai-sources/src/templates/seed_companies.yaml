# Seed list for `careerai sources sync`.
#
# Each entry is a known-public ATS slug for a company that plausibly
# matches at least one career-ai domain (`ai_ml`, `robotics_embedded`).
# `sources sync` probes the ATS, parses titles + JD content, scores
# them against the user's `domains:` keywords, and produces an add /
# keep / remove diff against the user's `config/local.yaml`.
#
# Schema (per entry):
#   slug:        ATS slug (matches the URL on the public board API)
#   ats:         greenhouse | lever | ashby
#   domain_hint: optional list of domain names (matches `domains[].name`
#                in CoreConfig). Currently informational — every company
#                is probed against every configured domain. Future use:
#                tighten initial probe (e.g. skip robotics_embedded for
#                a slug hinted ai_ml only).
#
# Curation methodology:
#   1. Started from the user's brief (Anthropic, OpenAI, Cohere, Scale,
#      Databricks, Boston Dynamics, Figure, 1X, Skydio, Anduril, etc.)
#      plus a list of well-known AI/ML and robotics/embedded companies
#      that publish public ATS boards.
#   2. Verified each slug with a `curl -sI -m 5` HEAD request against
#      the corresponding public endpoint. Slugs returning HTTP 200 are
#      kept; HTTP 404 entries are dropped or commented as `# unverified`
#      so the user is not hit with probe failures on first sync.
#   3. Endpoints used to verify:
#      - Greenhouse: https://boards-api.greenhouse.io/v1/boards/<slug>/jobs
#      - Lever:      https://api.lever.co/v0/postings/<slug>?mode=json
#      - Ashby:      https://api.ashbyhq.com/posting-api/job-board/<slug>
#   4. Out-of-scope: scraping the entire ATS catalog. Quality > quantity.
#      Each verified hit was sampled to confirm the company actually
#      ships AI/ML or robotics/embedded roles (not just any role on a
#      generic ATS).
#
# Verified 2026-04-28. Re-run `careerai sources sync` periodically to
# re-probe; companies that stop posting matching JDs will land in the
# `remove` partition.

