[package]
name = "careerai-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pipeline orchestration entry points (discover/match/tailor/render/apply) for career-ai"

[dependencies]
careerai-core = { path = "../careerai-core" }
careerai-db = { path = "../careerai-db" }
careerai-profile = { path = "../careerai-profile" }
careerai-sources = { path = "../careerai-sources" }
careerai-match = { path = "../careerai-match" }
careerai-llm = { path = "../careerai-llm" }
careerai-tailor = { path = "../careerai-tailor" }
careerai-render = { path = "../careerai-render" }
careerai-submit = { path = "../careerai-submit" }
careerai-notify = { path = "../careerai-notify" }
reqwest.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true

[features]
default = ["live-llm-cli", "browser"]
# Granular pass-through into careerai-llm.
live-llm-cli = ["careerai-llm/live-llm-cli"]
live-llm-api = ["careerai-llm/live-llm-api"]
# Back-compat umbrella; flips both backends on.
live-llm = ["live-llm-cli", "live-llm-api"]
# Forwards the browser flag down both the submit and sources crates.
# `careerai-submit/browser` enables the M5 LinkedIn submitter; the
# new `careerai-sources/browser` enables the M2 LinkedIn discovery
# adapter (PR #25). Both share the same `BrowserSession` + stealth
# script + cookie store, so they're toggled together.
browser = ["careerai-submit/browser", "careerai-sources/browser"]

[dev-dependencies]
async-trait.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true }
which.workspace = true
wiremock = "0.6"

[lints]
workspace = true
