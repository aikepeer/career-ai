[package]
name = "careerai-tailor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Constrained-diff resume tailoring and cover-letter drafting"

[dependencies]
careerai-core = { path = "../careerai-core" }
careerai-profile = { path = "../careerai-profile" }
careerai-match = { path = "../careerai-match" }
careerai-llm = { path = "../careerai-llm" }
careerai-db = { path = "../careerai-db" }
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true }
tracing.workspace = true
regex = "1"
uuid.workspace = true
chrono.workspace = true
tera = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true

[features]
# End-to-end smoke for the claude CLI backend (PR #21, merged
# 2026-04-28). Run via:
#   cargo test -p careerai-tailor --features tailor-claude-cli-smoke
# Pulls in the CLI driver transitively through `careerai-llm`. The
# test file `tests/claude_cli_smoke_it.rs` is gated on the same
# feature so plain `cargo test -p careerai-tailor` stays minimal.
tailor-claude-cli-smoke = ["careerai-llm/live-llm-cli"]

[lints]
workspace = true
