[package]
name = "careerai-tailor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Constrained-diff resume tailoring and cover-letter drafting"

[dependencies]
careerai-core = { path = "../careerai-core" }
careerai-profile = { path = "../careerai-profile" }
careerai-llm = { path = "../careerai-llm" }
careerai-db = { path = "../careerai-db" }
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true }
tracing.workspace = true
regex = "1"
uuid.workspace = true
chrono.workspace = true
tera = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true

[features]
# End-to-end smoke for the claude CLI backend (PR #21). Gated so the
# tailor crate continues to build on `main` before that PR lands.
#
# Once PR #21 merges (which adds the `live-llm-cli` feature to
# `careerai-llm`), update this line to:
#   tailor-claude-cli-smoke = ["careerai-llm/live-llm-cli"]
# so `cargo test -p careerai-tailor --features tailor-claude-cli-smoke`
# pulls in the CLI backend transitively. Until then, the feature
# stays empty and the gated `tests/claude_cli_smoke_it.rs` module is
# also referenced by the same cfg, so toggling this feature flips the
# test on once the underlying backend is on `main`.
tailor-claude-cli-smoke = []

[lints]
workspace = true
