[package]
name = "careerai-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-provider LLM gateway with on-disk cache"

[dependencies]
careerai-core = { path = "../careerai-core" }
careerai-profile = { path = "../careerai-profile" }
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
backon.workspace = true
keyring.workspace = true
# rig-core 0.10 exposes Anthropic and OpenAI providers unconditionally from
# `rig::providers::{anthropic,openai}` — there are no `anthropic` /
# `openai` cargo features in the 0.10 line, and no `rig-anthropic` /
# `rig-openai` sibling crates exist on crates.io as of Apr 2026. The
# workspace pin remains `rig-core = "0.10"` with `default-features = false`;
# we only need the core client types and reuse `reqwest` for the actual
# POST since the high-level completion path doesn't wire Anthropic
# prompt-cache `cache_control` onto content blocks.
rig-core = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
which = { workspace = true, optional = true }
# Used by the claude CLI driver to write system prompts to a 0o600
# tempfile (PII must not flow through `--append-system-prompt` argv).
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "cache"
harness = false

[features]
default = ["live-llm-cli", "live-llm-api"]
# claude CLI subprocess backend — reuses the user's logged-in Claude
# Code session. No ANTHROPIC_API_KEY required.
live-llm-cli = ["dep:which", "dep:tempfile"]
# rig-core / Anthropic API backend — requires ANTHROPIC_API_KEY.
live-llm-api = ["dep:rig-core", "dep:reqwest"]
# Back-compat umbrella alias; equivalent to enabling both backends.
live-llm = ["live-llm-cli", "live-llm-api"]

[lints]
workspace = true
