# Canonical user profile. Seeded by `careerai profile import`, then hand-edited.
# The real file at `profile/profile.yaml` is gitignored. Keep this example sanitized.

personal:
  name: "Your Name"
  email: "you@example.com"
  phone: "+91-0000000000"
  location: "Delhi NCR, India"
  links:
    github: "https://github.com/yourhandle"
    linkedin: "https://www.linkedin.com/in/yourhandle"
    portfolio: ""

summary: >
  One-paragraph elevator pitch. Kept stable across applications; per-job
  tailoring happens in the experience bullets, not here.

skills:
  languages: ["Rust", "Python", "C++"]
  frameworks: ["Tokio", "PyTorch", "ROS2"]
  tools: ["Linux", "Docker", "Git"]

experience:
  - title: "Role Title"
    company: "Company Name"
    location: "Remote"
    start: "2022-01"
    end: "present"
    bullets:
      - "Achievement-oriented bullet with a metric."
      - "Another bullet, 1-2 lines max."

education:
  - degree: "B.Tech, Computer Science"
    institution: "Your University"
    start: "2016"
    end: "2020"

projects:
  - name: "Project Name"
    url: "https://..."
    bullets:
      - "What it does; impact; stack used."

# Target-role archetypes (career-ops): named role profiles with a level
# and a fit class (primary = dream role, secondary = good fit,
# adjacent = stretch). Used as north-star framing in tailoring.
archetypes:
  - name: "AI/ML Engineer"
    level: "Senior/Staff"
    fit: "primary"
  - name: "Embedded Robotics Engineer"
    level: "Senior"
    fit: "secondary"

# Career narrative (career-ops): the profile's best material, surfaced
# to the tailor LLM and used by `careerai salary --gap`.
narrative:
  headline: "ML engineer turned AI product builder"
  exit_story: "Shipped RAG products end-to-end; now focused on applied AI at scale."
  superpowers:
    - "End-to-end ML pipelines"
    - "Fast prototyping"
  proof_points:
    - name: "Project Alpha"
      url: "https://..."
      hero_metric: "Reduced inference latency 40%"

# Compensation targets (career-ops): target range, walk-away minimum,
# and location flexibility. Optional; used by `careerai salary --gap`.
compensation:
  target_range: "$150K-200K"
  currency: "USD"
  minimum: "$120K"
  location_flexibility: "Remote preferred, 1 week/month on-site possible"
