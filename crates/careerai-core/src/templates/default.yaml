user:
  locations:
    - "Remote"
    - "Remote (India)"
    - "Delhi"
    - "Delhi NCR"
    - "Gurgaon"
    - "Noida"
    - "Bangalore-remote"
  timezone: "Asia/Kolkata"
  work_auth:
    india: true
    us: false
    eu: false

domains:
  - name: ai_ml
    keywords_any:
      - "machine learning"
      - "ml engineer"
      - "ai engineer"
      - "applied scientist"
      - "llm"
      - "nlp"
      - "computer vision"
      - "deep learning"
  - name: robotics_embedded
    keywords_any:
      - "robotics"
      - "embedded"
      - "firmware"
      - "ros"
      - "ros2"
      - "rtos"
      - "edge ai"
      - "slam"
      - "perception"
      - "autonomous"

match:
  embedding_model: "BAAI/bge-small-en-v1.5"
  score_threshold: 0.62
  # Hard filter: a listing must contain at least one of these tokens
  # (case-insensitive substring) somewhere in its title/description/skills,
  # or it's filtered out before scoring. Leave empty for no filter.
  must_include_skills: []

# NOTE: `rates.*` predates M5a and drives the legacy submit-layer
# guardrails. The M5a browser submitter reads `submit.linkedin.*`
# directly (see below); the duplicate `rates.linkedin` block stays
# for backward compat with M4-era configs.
rates:
  linkedin:
    max_per_day: 10
    min_seconds_between: 120
    jitter_seconds: 60
    quiet_hours: [0, 7]
  indeed:
    max_per_day: 15
    min_seconds_between: 90
    jitter_seconds: 45
  ats_http:
    max_per_day: 50
  naukri:
    max_per_day: 30

submit:
  auto_submit: false
  per_source:
    greenhouse: { enabled: true }
    lever:      { enabled: true }
    ashby:      { enabled: true }
    remotive:   { enabled: true }
    remoteok:   { enabled: true }
    naukri:     { enabled: false }
    linkedin:   { enabled: false }
    indeed:     { enabled: false }
  # LinkedIn browser submitter (M5a). Only consulted when the CLI is
  # built with `--features browser`. Defaults tuned for India-remote
  # operators: small daily cap, long min-interval, late-night quiet
  # window.
  linkedin:
    screenshots_dir: "artifacts/screenshots/linkedin"
    headless: true
    max_per_day: 10
    min_seconds_between: 120
    jitter_seconds: 60
    quiet_hours_utc: [19, 1]
    action_timeout_seconds: 20
    interactive_only: true   # daemon never auto-clicks; only `careerai review` does
  # Naukri.com browser submitter (Tasks 2.5+2.6). Only consulted when the CLI
  # is built with `--features browser`. No `interactive_only` gate — Naukri
  # risk profile is low enough for daemon-driven auto-submit when operator
  # opts in via `submit.per_source.naukri.enabled=true` and `auto_submit=true`.
  naukri:
    headless: true
    max_per_day: 10
    min_seconds_between: 60
    jitter_seconds: 15
    quiet_hours_utc: [19, 1]
    action_timeout_seconds: 30
    # screenshots_dir defaults to artifacts/naukri-audit

llm:
  tailor_model: "anthropic/claude-sonnet-4-6"
  cover_letter_model: "anthropic/claude-sonnet-4-6"
  filter_model: "openai/gpt-4o-mini"
  parse_resume_model: "anthropic/claude-sonnet-4-6"
  cache_dir: "data/cache/llm"
  max_retries: 3
  timeout_seconds: 120
  prompt_version: "tailor.v1"
  anthropic_prompt_cache: true

scheduler:
  cadence:
    greenhouse: "0 0 */1 * * *"
    lever:      "0 0 */1 * * *"
    remotive:   "0 0 */2 * * *"
    naukri:     "0 15 */3 * * *"
    linkedin:   "0 0 */4 * * *"
    indeed:     "0 30 */4 * * *"
  # Periodic dry-run apply sweep over rendered/prepared applications. The
  # daemon hard-pins auto_submit=false on every tick — live submission is
  # operator-driven only (`careerai apply --auto-submit ...`). Left unset
  # by default so a fresh install never spins up apply ticks unprompted;
  # uncomment to enable a 15-minute sweep.
  # submit_cadence: "0 */15 * * * *"

# Job-board instances to poll on `careerai discover`.
# Greenhouse + Lever need one entry per company slug; Remotive and RemoteOK
# are single public feeds.
sources:
  greenhouse:
    companies:
      - "anthropic"
  lever:
    companies: []
  remotive:
    enabled: true
    category: "software-dev"
  remoteok:
    enabled: true
  naukri:
    enabled: false             # undocumented endpoint; opt-in
    keywords:
      - "machine learning"
      - "llm"
      - "robotics"
    location: "Delhi / NCR"
    max_results: 20
  # Indeed public RSS feed. ToS-clean and stable — no auth, light rate
  # limits, plain XML. One query (keywords + optional location +
  # recency window). Disabled by default; flip `enabled: true` to opt
  # in. The cron cadence for this source is read from
  # `scheduler.cadence.indeed_rss` below; add an entry like
  # `indeed_rss: "0 */6 * * * *"` to the cadence map to schedule it.
  indeed_rss:
    enabled: false
    keywords: "AI engineer remote"
    location: ""
    fromage: 7                 # last 7 days
    rate_per_minute: 4
  # Community / third-party Model-Context-Protocol servers used as
  # discovery sources. Each entry spawns a stdio MCP server (the same
  # way Claude itself spawns one), runs `tools/list`, and invokes the
  # first tool whose name matches `search_jobs` / `discover_jobs` /
  # `find_jobs` / `list_jobs` / `jobs.search`. Default empty;
  # uncomment and flip `enabled: true` to opt in.
  #
  # mcp:
  #   - name: linkedin-jobs-mcp
  #     enabled: false           # default off — user must opt in (ToS)
  #     submit_enabled: false    # discovery only; this MCP doesn't submit
  #     cron: "0 0 */6 * * *"
  #     rate_per_minute: 5
  #     mcp:
  #       command: "uvx"
  #       args: ["linkedin-jobs-mcp-server"]
  #       env:
  #         RAPIDAPI_KEY: "${LINKEDIN_RAPIDAPI_KEY}"
  #       query:
  #         keywords: "AI engineer remote"
  #         location: "Worldwide"
  #         limit: 25

render:
  artifacts_dir: "artifacts"
  pandoc_bin: null
  pdf_engine: "weasyprint"
  timeout_seconds: 60
  keep_intermediate_markdown: true
